# 书坊引擎的打包:运行时 + 依赖 + 引擎代码 + pdf_tool → Release 资产。
# 只做 Windows 与 macOS(arm64 / x64);其它平台先不考虑。
# 触发:打 engine-v* tag(会发布);或手动 workflow_dispatch(只出 artifacts)。
name: Engine

on:
  push:
    tags: ["engine-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: macos-14
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pdf_tool 用仓库里的快照(engine/vendor/pdf_tool,固定 commit;刷新见 scripts/vendor-pdf-tool.mjs)。
      - name: Build the engine bundle
        run: node scripts/build-engine.mjs --platform ${{ matrix.platform }}
        env:
          # python-build-standalone 的 release 查询要带 token,否则匿名 API 会被限流。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the bundle (manifest, licenses, sha256)
        run: node scripts/check-engine-bundle.mjs dist/engine --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: dist/engine/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/engine-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the engine release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "UV Reader 书坊引擎(独立部署的本地 HTTP 服务,Windows 与 macOS)。

          解压后按包内 README.txt 启动,或在应用的「设置 → 书坊 → 书坊引擎」里点「从本地包安装」;应用里也有「下载并安装引擎」会自动下载对应的包并填好地址与令牌。

          **包里自带(装完不用再装)**:私有 Python、PyMuPDF / Pillow / latex2mathml、pdf_tool(固定 commit)、FastAPI + uvicorn。

          **还需要另外装**:DocVortex(文档互转 / 内容提取;可 pip 装到引擎的 Python 里)、MinerU(公式 / 视觉提取;本地服务可选、模型按需下载,或云端 token)。

          **可选组件**:Calibre(EPUB → AZW3 / MOBI)、boko(EPUB → AZW3 / KFX)。这两个是 GPL-3,不随包发。

          DocVortex 依赖 onnxruntime 等(装进来会让包大一倍以上),MinerU 的模型是 GB 级 —— 所以它们按「外部组件」处理,引擎只负责调用。"
