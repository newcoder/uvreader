name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the engine's deps
        run: pip install -r engine/requirements.txt -r engine/requirements-dev.txt
      - name: Test the engine (contract, auth, config, capabilities, jobs)
        run: python -m pytest engine/tests -q

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The desktop tests import the pi-ai runtime, so the shell's own
      # dependencies must be installed before they run.
      - run: npm ci --prefix apps/desktop
      - run: npm test
      - run: npm run test:shim
      - run: npm run test:desktop
      # Job logs need an authenticated client, so mirror the failing tests into
      # check annotations (readable from the API) when the suite trips.
      - name: Report failing desktop tests
        if: failure()
        run: |
          npm run test:desktop -- --test-reporter=tap > /tmp/desktop.tap 2>&1 || true
          # A test file that fails to *load* only prints a file-level block in TAP,
          # and the reason sits at the very top of the stream: dump the head first.
          head -60 /tmp/desktop.tap | while IFS= read -r line; do
            echo "::error ::TAP-HEAD $line"
          done
          grep -E "^not ok |^  error: " /tmp/desktop.tap | head -40 | while IFS= read -r line; do
            echo "::error ::$line"
          done
          # The annotations above only name the failing files. Emit the TAP block of
          # each failure (assertion, expected/actual, stack) so the API can show the
          # real reason without downloading the job log.
          awk '/^not ok [0-9]+ - /{capture=1} capture{print; count++} count>120{exit}' /tmp/desktop.tap \
            | head -120 | while IFS= read -r line; do
            echo "::error ::$line"
          done
      - run: npm run check:i18n
      - name: Lint the reader and the desktop shell
        run: npx eslint packages/reader/src packages/host-shim apps/desktop/src apps/desktop/test apps/desktop/scripts apps/desktop/build.mjs tests scripts --max-warnings=0
      - name: Build the desktop bundles
        run: npm run desktop:build
      - name: Smoke the desktop shell (virtual display)
        run: xvfb-run -a npm run desktop:smoke
        env:
          CI: "1"
