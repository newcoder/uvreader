name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:shim
      - run: npm run test:desktop
      - run: npm run check:i18n
      - run: npx eslint packages/reader/src/ --max-warnings=0
      - name: Build the desktop bundles
        run: |
          cd apps/desktop
          npm ci
          npm run build
      - name: Smoke the desktop shell (virtual display)
        run: xvfb-run -a npm run desktop:smoke
        env:
          CI: "1"
