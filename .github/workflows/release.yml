name: Release

on:
  push:
    tags: ["v*"]
  # Allows re-running a failed release from the Actions UI (pick the tag ref).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: Check that the tag matches package.json
        run: node scripts/check-release-tag.mjs
      - run: npm ci
      # The desktop tests import the pi-ai runtime, so the shell's own
      # dependencies must be installed before they run.
      - run: npm ci --prefix apps/desktop
      - run: npm test
      - run: npm run test:shim
      - run: npm run test:desktop
      - run: npm run check:i18n
      - name: Lint the reader and the desktop shell
        run: npx eslint packages/reader/src packages/host-shim apps/desktop/src apps/desktop/test apps/desktop/scripts apps/desktop/build.mjs tests scripts --max-warnings=0

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            macArch: ""
          # Build each Mac architecture on its own runner. A single
          # macos-latest job builds both DMGs and has repeatedly waited on
          # scarce arm64 capacity, which can stall the whole release.
          - os: macos-15-intel
            artifact: macos-x64
            macArch: x64
          - os: macos-15
            artifact: macos-arm64
            macArch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci
      - name: Install the Electron shell
        run: npm ci --prefix apps/desktop
      - name: Package the installers
        run: npm run desktop:dist
        env:
          # Code signing and notarization are tracked separately (P-6).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          QBR_MAC_ARCH: ${{ matrix.macArch }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
