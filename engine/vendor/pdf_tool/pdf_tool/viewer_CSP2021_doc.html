<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题目预览 - question_bank</title>
<style>
  :root { --line:#e3e4e8; --muted:#8a8f98; --card:#fff; --bg:#f4f5f7; --accent:#2f6fed; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.7 "Segoe UI", "Microsoft YaHei", sans-serif;
         background:var(--bg); color:#222; }
  header { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line);
           padding:14px 24px; z-index:5; }
  h1 { margin:0 0 6px; font-size:20px; }
  .meta { color:var(--muted); font-size:13px; }
  main { max-width: 880px; margin: 0 auto; padding: 18px 16px 80px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 18px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:10px;
          padding:8px 16px; font-size:13px; }
  .stat b { font-size:18px; display:block; }
  .category { background:#eef2fb; border:1px solid #d4ddf3; border-radius:10px;
              padding:8px 14px; margin:14px 0 6px; font-weight:600; font-size:15px; }
  .category small { font-weight:400; color:var(--muted); margin-left:8px; }
  .qcard { background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:16px 18px; margin:10px 0; }
  .qhead { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .qno { font-weight:700; font-size:15px; }
  .badge { font-size:12px; padding:2px 10px; border-radius:99px; color:#fff; }
  .b-choice-single { background:#2f6fed; } .b-choice-multiple { background:#7c4dff; }
  .b-true-false { background:#0d9b6e; } .b-fill-blank { background:#e08600; }
  .b-short-answer { background:#d64545; } .b-programming { background:#4b5563; }
  .b-other { background:#8a8f98; }
  .qtext { white-space:pre-wrap; word-break:break-word; }
  .qtext code { background:#f0f1f3; border-radius:4px; padding:0 5px;
                font-family:Consolas,monospace; font-size:13px; }
  .qtext pre { background:#f6f7f9; border:1px solid var(--line); border-radius:8px;
               padding:10px 14px; overflow-x:auto; }
  .qtext img { max-width: 100%; border:1px solid var(--line); border-radius:8px;
               margin:6px 0; background:#fff; }
  .mdtable { border-collapse:collapse; margin:8px 0; width:auto; background:#fff; }
  .mdtable th, .mdtable td { border:1px solid var(--line); padding:4px 12px; text-align:center; }
  .mdtable th { background:#f0f3fa; font-weight:600; }
  .options { margin:8px 0 2px 4px; }
  .option { display:flex; gap:8px; padding:3px 0; align-items:flex-start; }
  .option .key { font-weight:700; min-width:26px; }
  .blank { display:inline-block; min-width:90px; border-bottom:2px solid var(--accent);
           background:#f3f7ff; border-radius:4px; text-align:center; color:#8ab; margin:0 2px; }
  .answerbox { margin-top:10px; padding:10px 14px; border-left:4px solid #0d9b6e;
               background:#f2fbf6; font-size:13px; }
  .answerbox b { color:#0d9b6e; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  .examnotes { background:#fffdf3; border:1px solid #efe3b8; border-radius:10px;
               padding:12px 16px; margin:0 0 14px; white-space:pre-wrap; font-size:14px; }
  .examnotes b { display:block; margin-bottom:6px; color:#8a6d1a; }
  .posbadge { color:var(--muted); font-size:12px; font-weight:400; margin-left:8px; }
  .figimg { display:block; max-width:100%; border:1px solid var(--line); border-radius:8px;
            margin:6px 0; background:#fff; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .toolbar input[type=file] { font-size:13px; }
</style>
</head>

  </div>
</header>

<script>
const SAMPLE = {"blocks": [{"type": "heading", "position": "Page 1", "level": 1, "text": "2021 CCF非专业级别软件能力认证第一轮（CSP-J1）入门级 C++语言试题"}, {"type": "text", "position": "Page 1", "text": "认证时间：2021 年 9 月 19 日 14:30~16:30"}, {"type": "text", "position": "Page 1", "text": "考生注意事项："}, {"type": "text", "position": "Page 1", "text": "l 试题纸共有12页，答题纸共有 1页，满分100分。请在答题纸上作答，写在试题纸上的一律无效。"}, {"type": "text", "position": "Page 1", "text": "l 不得使用任何电子设备（如计算器、手机、电子词典等）或查阅任何书籍资料。"}, {"type": "heading", "position": "Page 1", "level": 2, "text": "一、单项选择题（共 15 题，每题 2 分，共计 30 分；每题有且仅有一个正确选项）"}, {"type": "text", "position": "Page 1", "text": "1. 以下不属于面向对象程序设计语言的是（ ）。A. C++B. PythonC. JavaD. C"}, {"type": "text", "position": "Page 1", "text": "2. 以下奖项与计算机领域最相关的是（ ）。A. 奥斯卡奖B. 图灵奖C. 诺贝尔奖D. 普利策奖"}, {"type": "text", "position": "Page 1", "text": "3. 目前主流的计算机储存数据最终都是转换成（ ）数据进行储存。A. 二进制B. 十进制C. 八进制D. 十六进制"}, {"type": "text", "position": "Page 1", "text": "4. 以比较作为基本运算，在N个数中找出最大数，最坏情况下所需要的最少的比较次数为（ ）。A. $\\mathsf { N } ^ { 2 }$"}, {"type": "text", "position": "Page 2", "text": "5. 对于入栈顺序为a, b, c, d, e的序列，下列（ ）不是合法的出栈序列。A. a, b, c, d, eB. e, d, c, b, aC. b, a, c, d, eD. c, d, a, e, b"}, {"type": "text", "position": "Page 2", "text": "6. 对于有n个顶点、m条边的无向连通图 (m>n)，需要删掉（ ）条边才能使其成为一棵树。A. n-1B. m-nC. m-n-1D. m-n+1"}, {"type": "text", "position": "Page 2", "text": "7. 二进制数101.11对应的十进制数是（ ）。A. 6.5B. 5.5C. 5.75D. 5.25"}, {"type": "text", "position": "Page 2", "text": "8. 如果一棵二叉树只有根结点，那么这棵二叉树高度为1。请问高度为5的完全二叉树有（ ）种不同的形态？A. 16B. 15C. 17D. 32"}, {"type": "text", "position": "Page 3", "text": "9. 表达式 ${ \\mathsf { a } } ^ { * } ( { \\mathsf { b } } + { \\mathsf { c } } ) ^ { * } { \\mathsf { d } }$ 的后缀表达式为( )，其中“*”和“+”是运算符。A. $\\ast \\ast _ { \\sf d + b c d }$ B. $a b c + ^ { * } d ^ { * }$ C. $a b c + d ^ { * * }$ D. $^ { * } { \\mathsf { a } } ^ { * } { + } { \\mathsf { b } } { \\mathsf { c } } { \\mathsf { d } }$"}, {"type": "text", "position": "Page 3", "text": "10.6个人，两个人组一队，总共组成三队，不区分队伍的编号。不同的组队情况有（ ）种。A. 10B. 15C. 30D. 20"}, {"type": "text", "position": "Page 3", "text": "11.在数据压缩编码中的哈夫曼编码方法，在本质上是一种（ ）的策略。A. 枚举B. 贪心C. 递归D. 动态规划"}, {"type": "text", "position": "Page 3", "text": "12.由 1，1，2，2，3 这五个数字组成不同的三位数有（ ）种。A. 18B. 15C. 12D. 24"}, {"type": "text", "position": "Page 3", "text": "13.考虑如下递归算法 solve(n) if n<=1 return 1 else if n>=5 return n*solve(n-2) else return n*solve(n-1)"}, {"type": "image", "position": "Page 4", "image": {"src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAEWARQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD3+iiigAooooAKKKKACiiigAooooAKoarrWl6HbC51W/t7OInarTSBdx9B6n2FX6878U6JZWXxD0vxnrWuwQafZQmGGylQszSnP3AOSeQeATxQB1WkeL/D2vXL22l6vaXNwgy0KvhwPXaecVtV4L4x1M3nxl8Falb6Ve6cZZRH5t1GInuF3gZ253AYYj5gDz0r3qgAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAK8L8Wa3J4U+PFvrXiO0uZ9G+zCOxkSMusRKjJUeu7Occ817pRQB8/fEXxDLeeOvBfiE6LqUGlwz5ieWHEk4DKSRH1HHQHBPpXvGn3Ul7YQ3MtrLatIN3ky43qM8bsdDjHHbpVmigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAIbq5isrOe6mbbFDG0jn0UDJ/QV8ceMviX4h8X6pNNLf3FtY7iILOGQqiJ2zj7x9Sf0HFfYepWUepaVeWEpxHcwPC59AykH+dfCV/aix1C5tBNHOIJWi82I5R9pI3Ke4OMigD0T4Y/FHWvDviSzs7+/uLvSLmVYZYZ5C/lbjgOhP3cE5IHBGe+DX1nXwbY2l6yvqMFjNc . “65532 33” B. “65552 32” C. “65535 34” D. “65554 33”"}, {"type": "code", "position": "Page 5", "lang": "cpp", "content": "01 #include <iostream>\n02 #include <string>\n03 using namespace std;\n04\n05 char base[64];\n06 char table[256];\n07\n08 void init()\n09 {\n10    for (int i = 0; i < 26; i++) base[i] = 'A' + i;\n11    for (int i = 0; i < 26; i++) base[26 + i] = 'a' + i;\n12    for (int i = 0; i < 10; i++) base[52 + i] = '0' + i;\n13    base[62] = '+', base[63] = '/';\n14\n15    for (int i = 0; i < 256; i++) table[i] = 0xff;\n16    for (int i = 0; i < 64; i++) table[base[i]] = i;\n17    table['='] = 0;\n18 }\n19\n20 string decode(string str)\n21 {\n22    string ret;\n23    int i;\n24    for (i = 0; i < str.size(); i += 4) {\n25    ret += table[str[i]] << 2 | table[str[i + 1]] >> 4;\n26    if (str[i + 2] != '=')\n27    ret += (table[str[i + 1]] & 0x0f) << 4 | table[str[i + 2]] >> 2;\n28    if (str[i + 3] != '=')\n29    ret += table[str[i + 2]] << 6 | table[str[i + 3]];\n30    }\n31    return ret;\n32 }\n33\n34 int main()\n35 {\n36    init();\n37    cout << int(table[0]) << endl;\n38\n39    string str;\n40    cin >> str;\n41    cout << decode(str) << endl;\n42    return 0;\n43 }"}, {"type": "text", "position": "Page 6", "text": "l 判断题"}, {"type": "text", "position": "Page 7", "text": "22. 输出的第二行一定是由小写字母、大写字母、数字和“+”、“/”、“=”构成的字符串。（ ）"}, {"type": "text", "position": "Page 7", "text": "23.可能存在输入不同，但输出的第二行相同的情形。（ ）"}, {"type": "text", "position": "Page 7", "text": "24.输出的第一行为“-1”。（ ）"}, {"type": "text", "position": "Page 7", "text": "l 单选题"}, {"type": "text", "position": "Page 7", "text": "25.设输入字符串长度为n，decode函数的时间复杂度为（ ）。A. Θ(√�) B. Θ(�) C. Θ(� log �) D. Θ(�<sup>!<\/sup>)"}, {"type": "text", "position": "Page 7", "text": "26.当输入为“Y3Nx”时，输出的第二行为（ ）。A. “csp” B. “csq” C. “CSP” D. “Csp”"}, {"type": "text", "position": "Page 7", "text": "27.（3.5 分）当输入为“Y2NmIDIwMjE=”时，输出的第二行为（ ）。A. “ccf2021” B. “ccf2022” C. “ccf 2021” D. “ccf 2022”"}, {"type": "code", "position": "Page 7" A[t++] = A[i];\n32    return t;\n33 }\n34\n35 bool binary_search(point A[], int n, int x, int y) {\n36    point p;\n37    p.x = x;\n38    p.y = y;\n39    p.id = n;\n40    int a = 0, b = n - 1;\n41    while (a < b) {\n42    int mid = ③;\n43    if (④)\n44    a = mid + 1;\n45    else\n46    b = mid;\n47    }\n48    return equals(A[a], p);\n49 }\n50\n51 const int MAXN = 1000;\n52 point A[MAXN];\n53\n54 int main() {\n55    int n;\n56    cin >> n;\n57    for (int i = 0; i < n; i++) {\n58    cin >> A[i].x >> A[i].y;\n59    A[i].id = i;\n60    }\n61    sort(A, n);\n62    n = unique(A, n);\n63    int ans = 0;\n64    for (int i = 0; i < n; i++)\n65    for (int j = 0; j < n; j++)\n66    if (⑤ && binary_search(A, n, A[i].x, A[j].y) && binary_search(A, n, A[j].x, A[i].y)) {\n67    ans++;\n68    }\n69    cout << ans << endl;\n70 return 0;\n71 }"}, {"type": "text", "position": "Page 12", "text": "39.①处应填（ ）A. ${ \\bf a . x . \\mu } \\mathrm {  ~ \\ l ~ 1 = ~ { \\bf ~ b . x . } ~ \\ l ~ a . x ~ \\ l ~ < ~ { \\bf ~ b . x . } ~ \\ l ~ a . i d ~ < ~ { \\bf ~ b . i d } ~ }$ B. $a . x ! = b . x ? a . x < b . x : a . y < b . y$ C. $\\mathrm { { e q u a l s ( a , \\ b ) \\ ? { \\ a . i d \\ < \\ b . i d \\ : \\ a . x \\ < \\ b . x } } }$ D. $\\mathrm { e q u a l s ( a , ~ b ) ~ \\ ? ~ { \\ a . i d } ~ < ~ b . i d ~ : ~ ( a . x ~ \\ ! = ~ b . x ~ \\ ? ~ { \\ a . x } ~ < ~ b . x ~ : ~ a . y ~ < ~ b . y ) }$"}, {"type": "text", "position": "Page 12", "text": "40.②处应填（ ）A. $\\textbf { i } = = \\emptyset ~ | ~ | ~ \\mathsf { c m p } ( \\mathsf { A } [ \\textbf { i } ] , ~ \\mathsf { A } [ \\textbf { i } ~ - ~ \\textbf { 1 } ] )$ B. $\\texttt { t } = = \\texttt { \\theta } | | \\texttt { e q u a l s } ( \\mathsf { A } [ \\texttt { i } ] , \\texttt { A } [ \\texttt { t } - \\texttt { 1 } ] )$ C. $\\begin{array} { r } { \\textbf { i } = = \\emptyset \\ | \\ | \\ \\mathbf { \\Sigma } | \\subset \\mathfrak { m p } ( \\mathsf { A } [ \\textbf { i } ] , \\ \\mathsf { A } [ \\textbf { i } \\textbf { - const TYPE_LABEL = {
  multiple_choice_single: '单选题', multiple_choice_multiple: '多选题',
  true_false: '判断题', fill_blank: '填空题', short_answer: '简答题',
  programming: '编程题'
};

function esc(s) {
  return String(s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 把 markdown 表格段转为真实 <table>；其余行做行内渲染 */
function renderTables(lines) {
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.indexOf('|') === 0) {
      const rows = [];
      while (i < lines.length && lines[i].indexOf('|') === 0) {
        const cells = lines[i].slice(1, -1).split('|').map(c => c.trim());
        rows.push(cells);
        i++;
      }
      // 去掉可能的分隔行（|---|）
      const dataRows = rows.filter(r => !(r.length && /^:?-{2,}:?$/.test(r[0]) &&
        r.every(c => /^:?-{2,}:?$/.test(c))));
      if (dataRows.length) {
        const head = dataRows[0];
        let h = '<table class="mdtable"><thead><tr>' +
          head.map(c => '<th>' + inlineMd(c) + '</th>').join('') + '</tr></thead><tbody>';
        for (let r = 1; r < dataRows.length; r++) {
          h += '<tr>' + dataRows[r].map(c => '<td>' + inlineMd(c || '') + '</td>').join('') +
            '</tr>';
        }
        out.push(h + '</tbody></table>');
        continue;
      }
      out.push(esc(line));
      continue;
    }
    out.push(inlineMd(line));
    i++;
  }
  return out.join('\n');
}

function inlineMd(s) {
  let h = esc(s);
  h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,
    (m, alt, src) => /^(data:|\.\.?\/|[a-z]+:\/\/)/.test(src)
      ? '<img src="' + src + '" alt="' + alt + '" loading="lazy">' : m);
  h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) =>
    /^(https?:|mailto:|#|\/)/.test(href)
      ? '<a href="' + href + '" target="_blank">' + label + '</a>' : m);
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  return h;
}

function mdRender(text) {
  if (!text) return '';
  const blocks = [];
  const parts = String(text).split(/```/);
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) { blocks.push('<pre>' + esc(parts[i]) + '</pre>'); continue; }
    blocks.push(renderTables(parts[i].split('\n')).replace(/\n/g, '\n'));
  }
  return blocks.join('');
}

function renderBlank(text) {
  // 填空题：把 ____ 换成输入框样式的占位
  return mdRender(text).replace(/(_+)/g, '<span class="blank">&nbsp;</span>');
}

const SAFE_TYPES = { multiple_choice_single: 1, multiple_choice_multiple: 1, true_false: 1,
                     fill_blank: 1, short_answer: 1, programming: 1 };
function typeBadge(t) {
  const safe = SAFE_TYPES[t] ? t : 'other';
  return '<span class="badge b-' + safe + '">' + esc(TYPE_LABEL[t] || t || '未知') + '</span>';
}

/* ---------- blocks 格式（--mode box 输出）---------- */

function asText(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  if (Array.isArray(v)) return v.map(asText).filter(Boolean).join('\n');
  if (typeof v === 'object') {
    if (typeof v.text === 'string') return v.text;
    if (typeof v.content === 'string') return v.content;
    if (Array.isArray(v.steps)) return v.steps.map(asText).filter(Boolean).join('\n');
  }
  return String(v);
}

function srcUrl(s) {
  const m = /!\[[^\]]*\]\(([^)\s]+)\)/.exec(String(s || ''));
  return m ? m[1] : String(s || '');
}

function refKeys(text) {
  const out = new Set();
  const re = /!\[插图(\d+)\]/g;
  let m;
  while ((m = re.exec(String(text || '')))) out.add(m[1]);
  return out;
}

function figHtml(src, alt) {
  const u = srcUrl(src);
  if (!/^(data:|https?:|\.{0,2}\/)/.test(u)) return '';
  return '<img class="figimg" src="' + u + '" alt="' + esc(asText(alt)) + '" loading="lazy">';
}

function tableHtml(headers, rows) {
  let h = '<table class="mdtable"><thead><tr>' +
    (headers || []).map(x => '<th>' + inlineMd(asText(x)) + '</th>').join('') +
    '</tr></thead><tbody>';
  (rows || []).forEach(r => {
    h += '<tr>' + r.map(c => '<td>' + inlineMd(asText(c)) +
      '</td>').join('') + '</tr>';
  });
  return h + '</tbody></table>';
}

function renderBlock(b) {
  const pos = b.position ? '<span class="posbadge">' + esc(b.position) + '</span>' : '';
  if (b.type === 'question') {
    const h = ['<div class="qcard">'];
    h.push('<div class="qhead"><span class="qno">题 ' + esc(b.number) + '</span>' + pos +
      '</div>');
    const stem = asText(b.stem);
    h.push('<div class="qtext">' + mdRender(stem) + '</div>');
    const inText = refKeys(stem);
    (b.images || []).forEach(im => {
      const k = /插图(\d+)/.exec(String(im.src || ''));
      if (k && inText.has(k[1])) return;  // 已在正文原位置渲染
      h.push(figHtml(im.src, im.alt));
    });
    const opts = b.options;
    let items = [];
    if (Array.isArray(opts)) items = opts.map((v, i) => [String.fromCharCode(65 + i), v]);
    else if (opts && typeof opts === 'object') items = Object.keys(opts).map(k => [k, opts[k]]);
    if (items.length) {
      h.push('<div class="options">');
      items.forEach(pair => {
        const k = pair[0], v = pair[1];
        const t = (v && typeof v === 'object') ? (v.text || '') : (v == null ? '' : v);
        let line = '<div class="option"><span class="key">' + esc(k) + '.</span>' +
          '<span class="qtext">' + mdRender(asText(t)) + '</span>';
        if (v && typeof v === 'object' && v.image && typeof v.image === 'object') {
          const kk = /插图(\d+)/.exec(String(v.image.src || ''));
          if (!(kk && (inText.has(kk[1]) || refKeys(asText(t)).has(kk[1])))) {
            line += figHtml(v.image.src, v.image.alt);
          }
        }
        h.push(line + '</div>');
      });
      h.push('</div>');
    }
    if (b.table && (b.table.headers || b.table.rows)) {
      h.push(tableHtml(b.table.headers, b.table.rows));
    }
    if (b.answer) {
      h.push('<div class="answerbox"><b>答案：</b>' + esc(asText(b.answer)) +
        (b.explanation ? '<br><b>解析：</b>' + mdRender(asText(b.explanation)) : '') +
        '</div>');
    }
    h.push('</div>');
    return h.join('');
  }
  if (b.type === 'text') {
    return '<div class="examnotes">' + pos +
      mdRender(asText(b.content != null ? b.content : b.text)) + '</div>';
  }
  if (b.type === 'image') {
    return figHtml((b.image || {}).src || b.src, (b.image || {}).alt);
  }
  if (b.type === 'equation') {  // MinerU：优先公式裁剪图，缺失时显示 LaTeX 源
    const fig = (b.image && b.image.src) ? figHtml(b.image.src, '公式') : '';
    if (fig) return fig;
    return '<div class="examnotes">' + esc(asText(b.text)) + '</div>';
  }
  if (b.type === 'table') {
    const tb = b.table || b;
    return tableHtml(tb.headers, tb.rows);
  }
  if (b.type === 'code') {
    return '<pre>' + esc(b.content || b.code || '') + '</pre>';
  }
  return '';
}

function renderBlocks(data) {
  const blocks = data.blocks || [];
  const qs = blocks.filter(b => b.type === 'question');
  document.title = '题目预览';
  document.getElementById('title').textContent = '题目预览';
  document.getElementById('meta').textContent =
    '题目:' + qs.length + ' | 内容块:' + blocks.length;
  document.getElementById('main').innerHTML =
    '<div class="stats">' +
    '<div class="stat"><b>' + qs.length + '</b>题目</div>' +
    '<div class="stat"><b>' + blocks.length + '</b>内容块</div>' +
    '</div>' +
    blocks.map(renderBlock).join('');
}

function renderQuestion(q) {
  const h = [];
  h.push('<div class="qcard">');
  h.push('<div class="qhead"><span class="qno">' + esc(q.question_no) + '.</span>' +
    typeBadge(q.question_type) + '</div>');
  h.push('<div class="qtext">' + renderBlank(q.question_text || '') + '</div>');
  const opts = q.options || [];
  if (opts.length) {
    h.push('<div class="options">');
    opts.forEach(o => h.push('<div class="option"><span class="key">' +
      esc(o.option_id || o.key) + '.</span><span class="qtext">' +
      renderBlank(o.option_text || '') + '</span></div>'));
    h.push('</div>');
  }
  if ((q.answer || q.explanation) && String(q.answer) !== 'null') {
    h.push('<div class="answerbox"><b>答案：</b>' + esc(q.answer || '—') +
      (q.explanation ? '<br><b>解析：</b>' + esc(q.explanation) : '') + '</div>');
  }
  h.push('</div>');
  return h.join('');
}

function render(data) {
  if (Array.isArray(data.blocks)) { renderBlocks(data); return; }
  document.title = data.exam_info && data.exam_info.title ? data.exam_info.title : '题目预览';
  document.getElementById('title').textContent =
    (data.exam_info && data.exam_info.title) || '题目预览';
  const ei = data.exam_info || {};
  document.getElementById('meta').textContent =
    ['总分:' + (ei.total_score || '?'), '题量:' + (ei.question_count || data.questions.length),
     '时限:' + (ei.time_limit || '?')].filter(Boolean).join(' | ');
  const main = document.getElementById('main');
  const qs = data.questions || [];
  const countBy = {};
  qs.forEach(q => { countBy[q.question_type] = (countBy[q.question_type] || 0) + 1; });
  const notesByAfter = {};
  (data.document_notes || []).forEach(n => {
    const key = n.after_question_id || '__start__';
    (notesByAfter[key] = notesByAfter[key] || []).push(String(n.text || ''));
  });
  const notesHtml = key => (notesByAfter[key] || []).map(t =>
    '<div class="examnotes">' + esc(t) + '</div>').join('');
  main.innerHTML =
    notesHtml('__start__') +
    '<div class="stats">' +
    '<div class="stat"><b>' + qs.length + '</b>总题数</div>' +
    Object.keys(countBy).map(k => '<div class="stat"><b>' + countBy[k] + '</b>' +
      esc(TYPE_LABEL[k] || k || '') + '</div>').join('') +
    '</div>' +
    qs.map(q => renderQuestion(q) + notesHtml(q.question_id)).join('');
}

/* 数据里图片已内嵌为 data: URI（make_viewer.py 注入），无需额外处理 */
function loadFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try { render(JSON.parse(reader.result)); } catch (e) { alert('JSON 解析失败: ' + e.message); }
  };
  reader.readAsText(file, 'utf-8');
}

document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) loadFromFile(f);
});

render(SAMPLE);
</script>
